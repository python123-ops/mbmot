name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BASH_ENV: ${{ github.workspace }}/_build/maintenance/log-shell.sh

jobs:
  moonbit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ${{ fromJSON(github.event_name == 'schedule' && '["latest"]' || '["0.10.20+65efd5b93"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture validation logs
        run: |
          mkdir -p _build/maintenance
          cat > "$BASH_ENV" <<'EOF'
          exec > >(tee -a "$GITHUB_WORKSPACE/_build/maintenance/checks.log") 2>&1
          EOF
      - uses: hustcer/setup-moonbit@v1.25
        with:
          version: ${{ matrix.toolchain }}
          core-version: ${{ matrix.toolchain }}
      - name: Show toolchain
        run: moon version --all | tee _build/maintenance/toolchain.log
      - name: Refresh package registry
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check all stable backends
        run: moon check --target all --deny-warn
      - name: Build all stable backends
        run: moon build --target all --deny-warn
      - name: Test all stable backends
        run: moon test --target all --deny-warn
      - name: Build the browser product
        env:
          MBMOT_MOON: moon
        run: |
          node web/build.mjs
          node web/tests/bridge.mjs _build/site/mbmot.js
          node web/tests/workbench.mjs _build/site/mbmot.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recorded-video test dependency
        run: python3 -m pip install -r tools/video_demo/requirements.txt
      - name: Test recorded-video process bridge and YOLO input
        env:
          MBMOT_TEST_MOON: moon
          MBMOT_FULL_VIDEO_TEST: "1"
        run: python3 tools/video_demo/test_pipeline.py
      - name: Generate interfaces
        run: moon info --target all
      - name: Install published 0.3.1 in a separate module
        run: |
          moon -C examples/consumer update
          moon -C examples/consumer test --target all --deny-warn
      - name: Install published 0.3.1 native CLI outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          moon install python123-ops/mbmot/replay@0.3.1 --bin "$RUNNER_TEMP/mbmot-bin"
          "$RUNNER_TEMP/mbmot-bin/replay" < "$GITHUB_WORKSPACE/examples/replay.ndjson" > replay.actual.ndjson
          diff -u "$GITHUB_WORKSPACE/examples/replay.expected.ndjson" replay.actual.ndjson
      - name: Verify the candidate archive and its consumer
        run: python3 tools/package_test.py
      - name: Replay the checked-in stream
        run: |
          moon run src/replay --target native < examples/replay.ndjson > replay.actual.ndjson
          diff -u examples/replay.expected.ndjson replay.actual.ndjson
      - name: Convert detector center boxes to replay input
        run: |
          moon run src/yolo_import --target native < examples/yolo.ndjson > yolo.actual.ndjson
          diff -u examples/yolo.expected.ndjson yolo.actual.ndjson
          moon run src/replay --target native < yolo.actual.ndjson > yolo.tracked.ndjson
          test "$(wc -l < yolo.tracked.ndjson)" -eq 2
          set +e
          { head -n 1 examples/yolo.ndjson; printf '%s\n' '{"frame":2,"width":0,"height":50,"coordinates":"pixels","detections":[]}'; } \
            | moon run src/yolo_import --target native > yolo.partial.ndjson 2> yolo.error.txt
          status=$?
          set -e
          test "$status" -ne 0
          test "$(wc -l < yolo.partial.ndjson)" -eq 1
          grep -F 'line 2: invalid frame' yolo.error.txt
      - name: Replay detector boxes through tracking and spatial rules
        env:
          MBMOT_MOON: moon
        run: node tools/observe_test.mjs
      - name: Compare the recorded detection stream across native and browser
        env:
          MBMOT_MOON: moon
        run: node tools/recording_test.mjs _build/site/mbmot.js
      - name: Check spatial event example
        run: |
          moon run src/analytics_demo --target native > analytics.actual.txt
          diff -u examples/analytics.expected.txt analytics.actual.txt
      - name: Replay external tracks through spatial analytics
        run: |
          moon run src/analytics_replay --target native < examples/analytics.ndjson > analytics.actual.ndjson
          diff -u examples/analytics.expected.ndjson analytics.actual.ndjson
      - name: Convert a MOT detection fixture
        run: |
          moon run --target native src/mot_track examples/mot/detections.txt mot.actual.txt
          diff -u examples/mot/tracked.expected.txt mot.actual.txt
      - name: Recalculate two MOT sequence fixtures
        run: |
          moon run src/mot_batch --target native -- examples/mot/batch/manifest.json > batch.actual.json
          diff -u examples/mot/batch/expected.json batch.actual.json
          moon run src/mot_batch --target native -- examples/mot/batch/manifest.json \
            --baseline examples/mot/batch/expected.json --max-mota-drop 0 --max-idf1-drop 0 \
            > batch.compared.json
          grep -F '"regressed":false' batch.compared.json
          set +e
          moon run src/mot_batch --target native -- examples/mot/batch/manifest.json \
            --baseline examples/mot/batch/high-baseline.json --max-mota-drop 0.1 --max-idf1-drop 0.1 \
            > batch.regressed.json 2> batch.error.txt
          status=$?
          set -e
          test "$status" -ne 0
          grep -F '"regressed":true' batch.regressed.json
          grep -F 'regression limit exceeded' batch.error.txt
      - name: Reject an invalid frame after complete output
        run: |
          set +e
          printf '%s\n' \
            '{"frame":1,"detections":[]}' \
            '{"frame":1,"detections":[]}' \
            | moon run src/replay --target native > replay.partial.ndjson 2> replay.error.txt
          status=$?
          set -e
          test "$status" -ne 0
          test "$(wc -l < replay.partial.ndjson)" -eq 1
          grep -F 'line 2: frame must increase: previous 1, received 1' replay.error.txt
      - name: Preserve complete spatial output before an invalid frame
        run: |
          set +e
          printf '%s\n' \
            '{"config":{"anchor":"bottom_center","stable_frames":1},"lines":[],"regions":[]}' \
            '{"frame":1,"tracks":[],"lost":[],"removed":[]}' \
            '{"frame":1,"tracks":[],"lost":[],"removed":[]}' \
            | moon run src/analytics_replay --target native > analytics.partial.ndjson 2> analytics.error.txt
          status=$?
          set -e
          test "$status" -ne 0
          test "$(wc -l < analytics.partial.ndjson)" -eq 1
          grep -F 'line 3: frame must increase: previous 1, received 1' analytics.error.txt
      - name: Preserve toolchain and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbmot-validation-${{ matrix.toolchain }}
          path: _build/maintenance/*.log
