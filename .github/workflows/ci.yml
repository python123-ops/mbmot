name: Core checks

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.25
        with:
          version: 0.10.12+1634b282e
          core-version: 0.10.12+1634b282e
      - name: Show toolchain
        run: moon version --all
      - name: Refresh package registry
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check all stable backends
        run: moon check --target all --deny-warn
      - name: Test all stable backends
        run: moon test --target all --deny-warn
      - name: Generate interfaces
        run: moon info --target all
      - name: Replay the checked-in stream
        run: |
          moon run src/replay --target native < examples/replay.ndjson > replay.actual.ndjson
          diff -u examples/replay.expected.ndjson replay.actual.ndjson
      - name: Reject an invalid frame after complete output
        run: |
          set +e
          printf '%s\n' \
            '{"frame":1,"detections":[]}' \
            '{"frame":1,"detections":[]}' \
            | moon run src/replay --target native > replay.partial.ndjson 2> replay.error.txt
          status=$?
          set -e
          test "$status" -ne 0
          test "$(wc -l < replay.partial.ndjson)" -eq 1
          grep -F 'line 2: frame must increase: previous 1, received 1' replay.error.txt
