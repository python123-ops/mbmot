name: Product website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.25
        with:
          version: 0.10.12+1634b282e
          core-version: 0.10.12+1634b282e
      - uses: actions/configure-pages@v5
      - name: Build static product website
        env:
          MBMOT_MOON: moon
        run: |
          moon update
          node web/build.mjs
          node web/tests/bridge.mjs _build/site/mbmot.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
